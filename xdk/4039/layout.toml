# XDK 4039 library data layouts the runtime reads or writes, proven by bond_eng.xbe (007: Agent Under Fire, PAL) at the
# addresses given. 4039 sits between 3948 and 4831: Swap and pointers to the frame surfaces as 4831, the present
# interval as a device field and GetBackBuffer's out pointer as 3948.
[layout]
# render and texture stage state numbers (runtime xdk/state_numbering.h): SetRenderStateNotInline 0x192EE0 takes states
# < 0x52 as simple (0x192EE5), < 0x75 as deferred (0x192F09), the rest through the complex setter table 0x19EE94
StateNumbering        = 4039
CDevice_Push          = 0x0     # D3DDevice_SetRenderState_Simple 0x192EB0 reads D3D_Device 0x1A0640
CDevice_PushThreshold = 0x4     # 0x192EB8 compares with 0x1A0644
CDevice_Flags         = 0x8     # D3DDevice_SetTransform 0x194180 stores it with bit 2 cleared
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x195060+ stores it
CDevice_Time          = 0x30    # D3DDevice_SetStreamSource 0x1971A6+ reads it into the old buffer
CDevice_PixelShader   = 0x4E8   # D3DDevice_SetPixelShader 0x19D130+ stores the handle
CDevice_VertexShader  = 0x4F8   # D3DDevice_SetVertexShader 0x197598 stores the current one, 0x197541 reads it
CDevice_IndexBuffer   = 0x504   # D3DDevice_SetIndices 0x19502A+ reads the old one, then stores the new one
CDevice_ZScale        = 0x5C4   # the viewport offset and scale 0x192FB6 scales the Z range by it
CDevice_SuperSampleX  = 0x5CC   # the viewport offset and scale 0x192F66 scales the width by it
CDevice_SuperSampleY  = 0x5D0   # the viewport offset and scale 0x192F8C scales the height by it
CDevice_BackBufferScale = 0x5DC # the frame buffer init 0x198F9A stores the X scale, 0x198FB3 the Y scale at +4
CDevice_Transforms    = 0x8D0   # D3DDevice_SetTransform 0x1940D0+ copies 16 dwords to +0x8D0 + type * 64
CDevice_Viewport      = 0xB50   # D3DDevice_SetViewport 0x194A50+ stores X; 0x192F4F reads Width at +8, 0x192F6C Height at +0xC
CDevice_ScreenSpaceOffset = 0xB68 # D3DDevice_SetScreenSpaceOffset 0x195343 stores x + offset, 0x195353 y + offset at +4
CDevice_Textures      = 0xBF8   # D3DDevice_SetTexture 0x194E80+ reads and stores [stage]
CDevice_Palettes      = 0xC08   # the device teardown 0x1999AD (lea +0xC08, 4 stages) releases them, the textures at -0x10
CDevice_RenderTarget  = 0x21F0  # D3DDevice_SetRenderState_MultiSampleMode 0x192E2F reads it, 0x192E35 compares with +0x21FC
CDevice_Depth         = 0x21F4  # D3DDevice_SetRenderState_MultiSampleMode 0x192E3D passes it back to SetRenderTarget
CDevice_BackBuffer    = 0x21FC  # D3DDevice_GetBackBuffer 0x1949E0+ reads +0x21FC + n * 4; the frame buffer init 0x199000 fills them
CDevice_FrontBuffer   = 0x2200  # the same read with index -1, n = 1
CDevice_AutoDepth     = 0x2208  # the frame buffer init 0x199020 stores the given depth buffer
CDevice_Tiles         = 0x229C  # D3DDevice_SetTile 0x19510D copies the 24-byte D3DTILE to +0x229C + index * 24
CDevice_PresentInterval = 0x21E4 # the frame buffer init 0x198F17 stores the present parameters' interval (+0x30)
PresentParams_BufferSurfaces = 0x34 # the frame buffer init 0x198FE2 takes BufferSurfaces at parameters + 0x34
CDevice_SwapCount     = 0x2C38  # D3DDevice_Swap 0x196210+ increments and returns it
CDevice_Size          = 0x2C60  # D3DDevice_Release 0x194210+ clears 0xB18 dwords after the last reference
# the display miniport is at +0x23E8 (D3DDevice_Reset 0x194400+, lea ebp); each below is +0x23E8 + the offset cited
CDevice_SwapCallback  = 0x25A8  # the swap handler 0x19AB89 calls [miniport + 0x1C0]
CDevice_VBlankCallback = 0x25AC # the vertical blank handler 0x19A902 reads [miniport + 0x1C4], 0x19A955 calls it
VBlankCallback_Count  = 0       # it passes a D3DVBLANKDATA pointer (0x19A950 lea ecx, [esp+0x1C]; 0x19A954 push ecx)
CDevice_VBlankEvent   = 0x25B0  # the vertical blank handler 0x19A8F5 takes the event at miniport + 0x1C8
CDevice_DisplayFlags  = 0x25D0  # 0x19A743 tests miniport + 0x1E8
CDevice_VBlankCount   = 0x25DC  # the vertical blank handler 0x19A833 stores miniport + 0x1F4 incremented
CDevice_GammaRamps    = 0x25F8  # the vertical blank handler 0x19A885 takes miniport + 0x210 + index * 0x300
CDevice_GammaPending  = 0x2BF8  # the vertical blank handler 0x19A875 tests, 0x19A894 clears miniport + 0x810 + index * 4
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x194E80+ ors it into D3D_DirtyFlags 0x1A01E8
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x1937F0+ scales the stage by 32
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x197190+ indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x197190+ stores Stride at 0x1A32B0
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x197190+ stores the vertex buffer at 0x1A32B8
PixelShader_Definition = 0x8    # D3DDevice_SetPixelShader 0x19D1AB reads the definition pointer
EffectsImage_Skip0    = 0x804   # 0x1C35C2 adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x1C35BC loads this dword count
EffectsImage_Desc     = 0x818   # 0x1C35CA: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
XPP_Current           = 0x0     # XGetDevices 0x1CC169+ returns it
XPP_Changed           = 0x4     # XGetDevices 0x1CC169+ clears it
XPP_Previous          = 0x8     # XGetDevices 0x1CC169+ copies Current into it
