# XDK 4831 library data layouts the runtime reads or writes. Each value is proven by the default.xbe
# (007: NightFire) code at the address given, with the PGR2 (5659) instruction it corresponds to in brackets.
# On every behaviour where 3948 and 5659 differ, 4831 goes the 5659 way (see the notes inline).
[layout]
# D3D8 render and texture stage state numbers: 5659's. SetRenderStateNotInline 0x1005B0 takes states < 0x5C as simple
# (0x1005B5), < 0x88 as deferred (0x1005D9), the rest through the complex setter table 0x10D728 (0x100602) [5659
# 0x1C0E35/0x1C0E59/0x1C0E82]; the complex table's 30 entries (136-165) are the same setters in 5659's order and the
# deferred dirty-flag table 0x161CA8 and simple encode table 0x161EC8 equal PGR2's 0x2757B0 / 0x2759D0 entry for entry.
# SetTextureStageStateNotInline 0x101040 takes stage states < 12 (AddressU..AlphaKill) first (0x101044) and stores
# ColorOp (12) at stage * 0x80 + 0x30 (0x1010A3) [5659 0x1C1874]: 5659 packing, not 3948's.
StateNumbering        = 5659
# D3D8 CDevice, the static device 0x10EB80 that D3D__pDevice (0x1117C0) points at (Direct3D_CreateDevice 0x1004E3)
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x103F02 reads it, 0x103F05 compares with +4, calls MakeSpace 0x106910 [0x1C407F]
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x103F05 compares the push pointer with it [0x1C4082]
CDevice_Flags         = 0x8     # Direct3D_CreateDevice 0x1004D6/0x1004F3 ors BehaviorFlags & 0x10 into device + 8 (0x10EB88);
                                # D3DDevice_SetPixelShader 0x10A111 tests that bit [0x1C58AE, 0x1C26A1]
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0x1040B9 stores BaseVertexIndex [0x1C41E9]
CDevice_Time          = 0x30    # D3D_SetFence 0x1065A0: 0x1065BD reads it, 0x106633 adds 2, 0x106639 stores it [0x1C5DF4/0x1C5E6B/0x1C5E78];
                                # SetStreamSource 0x1027CA and SetTexture 0x103ED3 stamp released resources with it
CDevice_PixelShader   = 0x370   # D3DDevice_SetPixelShader 0x10A048 stores the handle [0x1C25D8]
CDevice_VertexShader  = 0x380   # D3DDevice_SetVertexShader 0x102BB8 stores the current one, 0x102B61 reads it [0x1C047E, 0x1C0401];
                                # the device init 0x105F18 sets it to the FVF shader 0x111E40
CDevice_IndexBuffer   = 0x38C   # D3DDevice_SetIndices 0x10408A reads the old one, 0x1040B2 stores the new one [0x1C41BA, 0x1C41E2]
CDevice_ZScale        = 0x510   # the viewport offset and scale 0x100740 (called by SetViewport 0x103E75) scales the Z range
                                # (MaxZ - MinZ) by it at 0x1007B6, MinZ at 0x1007C6 [0x1C0F54 in 0x1C0E90]
CDevice_SuperSampleX  = 0x518   # the viewport offset and scale 0x100740 scales the width by it at 0x100766; the viewport
                                # push 0x101180 scales X at 0x101281 [SetViewport 0x1C3EC2]
CDevice_SuperSampleY  = 0x51C   # 0x100740 scales the height by it at 0x10078C; 0x101180 scales Y at 0x1012A3 [0x1C3F16]
CDevice_BackBufferScale = 0x528 # the frame buffer init 0x105560 stores the X scale as a float at 0x10562A, the Y scale at
                                # +4 at 0x105643 [0x1C954B/0x1C9564]; 0x103856 saves and restores both
CDevice_Transforms    = 0x810   # D3DDevice_SetTransform 0x103996 copies 16 dwords to +0x810 + type * 64 [0x1C34B6]
CDevice_Viewport      = 0xA90   # D3DDevice_SetViewport 0x103E4B to 0x103E6F stores X, Y, Width, Height, MinZ, MaxZ [0x1C3F60..0x1C3F8C]
CDevice_ScreenSpaceOffset = 0xAA8 # D3DDevice_SetScreenSpaceOffset 0x104390 stores x + offset at 0x1043A3, y + offset at +4
                                # (0x1043B3) [0x1C4783/0x1C4793]; 0x101180 adds it to X at 0x10128F
CDevice_Textures      = 0xB38   # D3DDevice_SetTexture 0x103EC0 reads, 0x103EF9 stores [stage] [0x1C3FF0, 0x1C4029]
CDevice_Palettes      = 0xB48   # the device teardown 0x105FF0 releases [stage] at 0x106094 (lea +0xB48, 4 stages), right after
                                # the textures at [edi-0x10] = +0xB38 [0x1C9F8F]
CDevice_RenderTarget  = 0x21B4  # D3DDevice_GetRenderTarget2 0x103D16 returns it [0x1C3D76]
CDevice_Depth         = 0x21B8  # D3DDevice_GetDepthStencilSurface2 0x103D36 returns it [0x1C3D96]
# frame buffers as 5659: pointers at +0x21C0 (back, front, third) to surface objects the init keeps at +0x21D0 + n * 24,
# which is how 5659 does it too (pointers +0x1A04, objects +0x1A14), so CDevice_FrameSurfaces stays unset
CDevice_BackBuffer    = 0x21C0  # D3DDevice_GetBackBuffer2 0x103C80 returns it for index 0 [0x1C3D50]
CDevice_FrontBuffer   = 0x21C4  # D3DDevice_GetBackBuffer2 0x103C65 returns it for index -1 (+0x21C0 + 1 * 4) [0x1C3D35]
CDevice_AutoDepth     = 0x21CC  # the frame buffer init stores the depth buffer at 0x1056E9 (given) and 0x1059DF (made),
                                # D3D_InitDefaultState 0x105360 reads it at 0x1053C0 [0x1C964A, 0x1C92D7]
PresentParams_BufferSurfaces = 0x34 # the frame buffer init 0x105675 takes BufferSurfaces at parameters + 0x34 (copied to
                                # +0x21D0 + n * 24, 0x1056A7), DepthStencilSurface at + 0x40 (0x1056CD) [0x1C9593, 0x1C9614]
CDevice_Tiles         = 0x2260  # D3DDevice_SetTile 0x104130 copies the 24-byte D3DTILE to +0x2260 + index * 24 (0x10416D),
                                # clears it there for a null tile (0x1041D1)
# the display miniport lives at +0x23C0: the device init 0x105B5F (add esi, 0x23C0, then its methods on ecx), the teardown
# 0x10604B, SetGammaRamp 0x103903, SetTile 0x1041A0, GetDisplayMode 0x103AEC [5659: +0x1C18, 0x1C4CEC, 0x1C9A87]
CDevice_SwapCallback  = 0x254C  # the swap handler 0x10B592 calls [miniport + 0x18C] (0x10B5D1) [0x1CAA02]; no setter is linked
CDevice_VBlankCallback = 0x2550 # the vertical blank handler 0x10B1E0 calls [miniport + 0x190] at 0x10B2AE/0x10B2D5 [0x1CA6DE]; no setter linked
VBlankCallback_Count  = 0       # it passes a D3DVBLANKDATA pointer (0x10B2C8 lea ecx, [esp+0x10]; push ecx) as 5659 does [0x1CA6F8]
CDevice_VBlankEvent   = 0x2554  # D3DDevice_BlockUntilVerticalBlank 0x103AA0 waits on it (0x103AB7), 0x103AAB clears its
                                # SignalState; the vertical blank handler 0x10B2A1 sets miniport + 0x194 [0x1C36BD, 0x1C36AB]
CDevice_DisplayFlags  = 0x2574  # the vertical blank handler 0x10B24D tests miniport + 0x1B4; GetDisplayMode 0x103C08 tests
                                # +0x2574 & 0x400000 for 60 Hz [0x1CA67D, 0x1C4C7B]
CDevice_VBlankCount   = 0x2580  # the vertical blank handler 0x10B211 stores miniport + 0x1C0 incremented; 0x102E97/0x102EAB
                                # read and bump +0x2580 [0x1CA641, 0x1C4355]
CDevice_Field         = 0x2590  # the vertical blank handler 0x10B274/0x10B283 stores the field at miniport + 0x1D0 [0x1CA6A4]
CDevice_GammaRamps    = 0x259C  # D3DDevice_SetGammaRamp 0x1038F0 compares/copies 0x300 bytes at miniport + 0x1DC + index * 0x300
                                # (0x103920, 0x103933) [0x1C3453/0x1C3463]
CDevice_GammaPending  = 0x2B9C  # D3DDevice_SetGammaRamp 0x103961 sets [miniport + 0x7DC + index * 4] [0x1C3481]
CDevice_SwapCount     = 0x2C10  # D3DDevice_Swap 0x103730 increments it at 0x103790/0x1037D0, returns it at 0x103801 [0x1C5670, 0x1C56AB]
CDevice_Size          = 0x2C30  # Direct3D_CreateDevice 0x10051B clears 0xB0C dwords of the device on failure [0x1C58EB]
# the present interval is the D3D_PresentInterval global 0x111BCC as in 5659, not a device field: the frame buffer init
# stores parameters + 0x30 there at 0x1055A3, the swap 0x103645 reads it [5659 0x1C94C4 into 0x1D093C]
# CDevice_PresentInterval  = none (3948 only)
# CDevice_FrameSurfaces    = none: see the frame buffer note above (objects at +0x21D0, the depth's at +0x2218, behind pointers)
# CDevice_AutoDepthSurface = none: likewise (object +0x2218 behind the pointer +0x21CC)
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x103F37 ors it into D3D__DirtyFlags 0x1117CC (null texture path)
                                # [0x1C4067]; SetPixelShader 0x10A056 ors the same
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x10105B/0x101060: [stage * 32 + type] dwords at
                                # 0x1117D0 (0x10106C) [0x1C188B/0x1C189C]
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x1027BA/0x1027BD indexes the stream table 0x111C68 by n * 12 [0x1C002A]
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x102802 stores Stride at 0x111C68 + n * 12 [0x1C0072]
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x102808 stores the vertex buffer at 0x111C70 + n * 12 [0x1C0078]
PixelShader_Definition = 0x8    # D3DDevice_SetPixelShader 0x10A0B0 reads the definition pointer [0x1C2640]
# DSOUND: to come (unset keys trap where the runtime first needs them)
# XAPI XPP device type record
XPP_Current           = 0x0     # XGetDevices 0x158137 returns it (0x158142, 0x158153)
XPP_Changed           = 0x4     # XGetDevices 0x158144 clears it, XGetDeviceChanges 0x158159 tests it (0x158162)
XPP_Previous          = 0x8     # XGetDevices 0x15814A copies Current into it
